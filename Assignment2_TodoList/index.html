
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-container">
        <h1>My To-Do List</h1>
        <p class="subtitle">Organize your day, one task at a time.</p>

        <form id="todo-form">
            <input
                type="text"
                id="task-input"
                placeholder="Enter a new task..."
                autocomplete="off"
            >
            <button type="submit">Add Task</button>
        </form>

        <p id="error-message" aria-live="polite"></p>

        <div class="task-summary">
            <span>Total: <strong id="total-count">0</strong></span>
            <span>Completed: <strong id="completed-count">0</strong></span>
        </div>

        <ul id="task-list"></ul>

        <p id="empty-message">No tasks yet. Add your first task!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
