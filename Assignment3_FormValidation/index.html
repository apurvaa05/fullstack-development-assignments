
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h1>Create Account</h1>
        <p class="subtitle">Fill in your details to register</p>

        <form id="registration-form" novalidate>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                >
                <small class="error" id="name-error"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="text"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                >
                <small class="error" id="email-error"></small>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter 10-digit phone number"
                    autocomplete="tel"
                >
                <small class="error" id="phone-error"></small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                >
                <small class="hint">
                    At least 8 characters, including uppercase,
                    lowercase, a number, and a special character.
                </small>
                <small class="error" id="password-error"></small>
            </div>

            <button type="submit">Register</button>

            <p id="success-message" aria-live="polite"></p>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
